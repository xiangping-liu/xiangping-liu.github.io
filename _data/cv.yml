    "Research Experience":
      - company: The University of Texas at Austin
        position: Ultrasound-Induced CaO2-Catalyzed Mechanoluminescent Nanoparticles for ChR2 Sono-Optogenetic Deep Brain Activation
        location: Austin, TX
        summary: "Supervisor: Prof. Huiliang (Evan) Wang"
        highlights:
          - Developed Lipo@IR780/L012/CaO2 liposomes with improved performance over first-generation organic blue mechanoluminescent nanoparticles by leveraging increased pH and H2O2 generation.
          - Demonstrated sono-optogenetic neuromodulation of the ventral tegmental area (VTA).
          - Evaluated neuronal activation after VTA stimulation using c-Fos staining.

      - company: The University of Texas at Austin
        position: Multicolored, Sonosensitizer-Optimized Organic Mechanoluminescent Nanoparticles for Functional Sono-Optogenetics
        location: Austin, TX
        summary: "Supervisor: Prof. Huiliang (Evan) Wang"
        highlights:
          - Developed wavelength-tunable organic mechanoluminescent nanoparticles using FRET.
          - Established a correlation between sonosensitizer energy gaps and ROS generation to guide sonosensitizer design and selection.
          - Demonstrated bidirectional neuromodulation of genetically defined neurons using ChR2/ChRmine for activation and eOPN3 for inhibition.


